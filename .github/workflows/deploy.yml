name: Daily Report

on:
  schedule:
    - cron: '0 10 */2 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt
      - name: 拉取历史日报页面
        run: |
          mkdir -p docs/daily docs/css
          git fetch origin gh-pages 2>/dev/null || true
          if git ls-remote --heads origin gh-pages 2>/dev/null | grep -q gh-pages; then
            git checkout origin/gh-pages -- . 2>/dev/null || true
            mkdir -p docs/daily docs/css
            cp -r daily/* docs/daily/ 2>/dev/null || true
            cp -r css/* docs/css/ 2>/dev/null || true
            git checkout master -- . 2>/dev/null || true
          fi
          echo "Existing daily pages:"
          ls -la docs/daily/ 2>/dev/null || echo "none"
      - name: 生成昨天的日报
        run: python fetch_with_llm.py $(date -d 'yesterday' +%Y-%m-%d)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      - name: 生成今天的日报
        run: python fetch_with_llm.py $(date +%Y-%m-%d)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      - name: 构建静态网站
        run: python build_site.py
      - name: 上传诊断日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-logs
          path: |
            data/debug_logs/
            data/site_data/
      - name: 部署到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
