name: Daily Report

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt
      - name: 搜索研报
        run: python -c "from scrapers.global_research import search_and_save; search_and_save(days=3, output_file='data/global_research_reports.json')"
      - run: python fetch_filtered.py --date $(date +%Y-%m-%d) --skip-url-check
      - run: python build_site.py
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          force_orphan: true